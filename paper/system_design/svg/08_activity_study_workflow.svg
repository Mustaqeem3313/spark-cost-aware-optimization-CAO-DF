-width:1.0;" width="261.9814" x="303.6733" y="53.377"/><rect fill="#DCFCE7" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="224.5088" x="323.4097" y="255.4204"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="204.5088" x="333.4097" y="277.6143">Generate study workloads, seed 42</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140.9053" x="333.4097" y="292.563">(workload_generator.py)</text><rect fill="#DCFCE7" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="156.5762" x="357.376" y="325.3179"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="136.5762" x="367.376" y="347.5117">E1: shuffle-volume gate</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="122.8145" x="367.376" y="362.4604">(verify_workloads.py)</text><rect fill="#DCFCE7" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="251.9814" x="309.6733" y="844.4976"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="231.9814" x="319.6733" y="866.6914">Generate 4 unseen validation workloads</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.1016" x="319.6733" y="881.6401">(workload_generator.py --validation)</text><line style="stroke:#000000;stroke-width:1.5;" x1="303.6733" x2="303.6733" y1="53.377" y2="1255.9849"/><rect fill="#FFF7ED" height="1202.6079" style="stroke:#FFF7ED;stroke-width:1.0;" width="295.5542" x="565.6548" y="53.377"/><rect fill="#FFEDD5" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="198.4834" x="615.1902" y="395.2153"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="178.4834" x="625.1902" y="417.4092">E2: exploratory partition sweep</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="161.1353" x="625.1902" y="432.3579">(explore_partition_curve.py)</text><rect fill="#FFEDD5" height="64.8462" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="285.5542" x="571.6548" y="465.1128"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="121.3672" x="581.6548" y="487.3066">E3: formal A1 matrix,</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="265.5542" x="581.6548" y="502.2554">8 settings x 4 workloads x 5 blocks = 160 runs</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="144.5171" x="581.6548" y="517.2041">(run_a1_experiments.py)</text><rect fill="#FFEDD5" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="200.6353" x="614.1143" y="549.959"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="150.3125" x="624.1143" y="572.1528">E4: A2 pilot gate, 3 blocks</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="180.6353" x="624.1143" y="587.1016">(run_a2_experiments.py --pilot)</text><rect fill="#FFEDD5" height="64.8462" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="271.8242" x="578.5198" y="619.8564"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="121.3672" x="588.5198" y="642.0503">E5: formal A2 matrix,</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="251.8242" x="588.5198" y="656.999">6 workloads x 3 stages x 5 blocks = 90 runs</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="144.5171" x="588.5198" y="671.9478">(run_a2_experiments.py)</text><rect fill="#FFEDD5" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="253.7651" x="587.5493" y="914.395"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="224.7388" x="597.5493" y="936.5889">E6: validation, 4 workloads x 10 stages</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.7651" x="597.5493" y="951.5376">x 3 blocks = 120 runs (run_validation.py)</text><line style="stroke:#000000;stroke-width:1.5;" x1="565.6548" x2="565.6548" y1="53.377" y2="1255.9849"/><rect fill="#F5F3FF" height="1202.6079" style="stroke:#F5F3FF;stroke-width:1.0;" width="336.7188" x="861.209" y="53.377"/><rect fill="#EDE9FE" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="185.4517" x="937.8425" y="704.7026"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.4517" x="947.8425" y="726.8965">Trimmed outlier check on A1</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="130.7808" x="947.8425" y="741.8452">(robustness_check.py)</text><rect fill="#EDE9FE" height="49.8975" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="326.7188" x="867.209" y="774.6001"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="306.7188" x="877.209" y="796.7939">Cost model: P1 / P2 costs, N*, TC at N = 1, 5, 10, 50,</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.4243" x="877.209" y="811.7427">price x0.5 / x1 / x1.5 (cost_model.py)</text><rect fill="#EDE9FE" height="64.8462" rx="6" ry="6" style="stroke:#181818;stroke-width:1.5;" width="272.1987" x="894.469" y="984.2925"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="227.9824" x="904.469" y="1006.4863">Decision rule + validation against static,</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1987" x="904.469" y="1021.4351">performance-only and oracle; leave-one-out</text><text fill